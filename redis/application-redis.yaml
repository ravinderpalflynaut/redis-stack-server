apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ravinderpalflynaut/redis-stack-server.git
    targetRevision: main
    path: redis
#    directory:
#      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: redis
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true

